<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>#<u>Student Registration Form</u>#</h1>
        <p>Please fill your details below to register.</p>
        <hr>
    </header>

    <main>
        <form action="/register" method="post"
                enctype="multipart/form-data">

            <!-- Personal Information -->
             <fieldset>
                <legend><h2>Personal Information</h2></legend>

                <label for="fullname">Full Name:</label>
                <br>
                <input type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        minlength="3"
                        maxlength="30"
                        required>
                <br><br>

                <label for="email">Email Address:</label>
                <br>
                <input type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>
                <br><br>

                <label for="password">Password:</label>
                <br>
                <input type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        minlength="8"
                        required>
                <br><br>

                <label for="phone">Mobile Number:</label>
                <br>
                <input type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit mobile no."
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>
                <br><br>

                <label for="dob">Date of Birth</label>
                <br>
                <input type="date"
                        id="dob"
                        name="dob"
                        required>
                <br><br>

                <p>Gender:</p>

                <input type="radio"
                        id="male"
                        name="gender"
                        value="Male"
                        required>
                <label for="male">Male</label>

                <input type="radio"
                        id="female"
                        name="gender"
                        value="Female">
                <label for="female">Female</label>

                <input type="radio"
                        id="other"
                        name="gender"
                        value="other">
                <label for="other">Other</label>

             </fieldset>

             <br>

             <!-- Academic Information -->
              <fieldset>
                <legend><h2>Academic Information</h2></legend>

                <label for="course">Select Course:</label>
                <br>

                <select name="course" id="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="java">Java Full Stack</option>
                    <option value="frontend">Frontend Development</option>
                    <option value="backend">Backend Development</option>
                    <option value="python">Python Development</option>
                    <option value="testing">Software Testing</option>
                    <option value="data-science">Data Science</option>
                </select>

                <br><br>

                <label for="qualification">Highest Qualification</label>

                <select name="qualification" 
                        id="qualification"
                        required>
                    <option value="">-- Select Qualification</option>
                    <option value="10th">10th</option>
                    <option value="12th">12th</option>
                    <option value="diploma">Diploma</option>
                    <option value="graduation">Graduation</option>
                    <option value="postgraduation">Post Graduation</option>
                </select>

                <br><br>

                <p>Select Your Skills:</p>

                <input type="checkbox"
                        id="html"
                        name="skills"
                        value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox"
                        id="css"
                        name="skills"
                        value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox"
                        id="javascript"
                        name="skills"
                        value="JavaScript">
                <label for="javascript">JavaScript</label>

                <input type="checkbox"
                        id="java"
                        name="skills"
                        value="Java">
                <label for="java">Java</label>

                <input type="checkbox"
                        id="react"
                        name="skills"
                        value="React">
                <label for="react">React</label>

                <br><br>

                <label for="address">Full Address:</label>
                <br>

                <textarea name="address"
                          id="address"
                          rows="2"
                          cols="40"
                          placeholder="Enter your complete address"
                          required>
                </textarea>

              </fieldset>

              <br>

              <!-- Document Upload -->
               <fieldset>
                    <legend><h2>Document Information</h2></legend>

                    <label for="resume">Upload Resume (PDF):</label>
                    <br>

                    <input type="file"
                            id="resume"
                            name="resume"
                            accept=".pdf"
                            required>
                    <br><br>

                    <label for="photo">Upload Profile Photo:</label>
                    <br>

                    <input type="file"
                            id="photo"
                            name="photo"
                            accept="image/*">
               </fieldset>

               <br>

               <!-- Terms and Conditions -->
                <fieldset>
                    <legend><h2>Confirmation</h2></legend>

                    <input type="checkbox"
                            id="terms"
                            name="terms"
                            value="accepted"
                            required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </fieldset>

                <br>

                <!-- Form Buttons -->
                 <button type="submit">Register Now</button>
                 <button type="reset">Reset Form</button>
        </form>

    </main>

    <br>
    <hr>

    <footer>
        <p>&copy; 2026 Student Registration Portal. All Rights Reserved.</p>
    </footer>
    
</body>
</html>
